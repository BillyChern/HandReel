  - name: ho3d
    url: https://1drv.ms/f/s!AsG9HA3ULXQRlFy5tCZXahAe3bEV?e=BevrKO
    requires_registration: false
    size_gb: null
    notes: |
      `curl -sIL https://www.tugraz.at/institute/icg/research/team-lepetit/research-projects/ho-3d/
      | head -1` -> HTTP/1.1 404 Not Found (the old URL has moved). The current
      project page is https://www.tugraz.at/institute/icg/research/team-lepetit/research-projects/
      hand-object-3d-pose-annotation -- `curl -sIL ... | head -1` -> HTTP/1.1 200 OK, but it lists
      no direct file links; it points to the authors' scripts repo
      https://github.com/shreyashampali/ho3d for current download links (v2/v3 GT + a Nov 2024
      GT-annotation update, plus CodaLab eval instructions).
      HO-3D v3 OneDrive folder (from ho3d README, 2026-09-12):
      https://1drv.ms/f/s!AsG9HA3ULXQRlFy5tCZXahAe3bEV?e=BevrKO
      A bare `curl -sIL` HEAD on the 1drv.ms short link returns HTTP/2 403 (OneDrive rejects
      bot-like HEAD requests); following the full redirect chain with a browser UA and GET
      (`curl -sL -o /dev/null -w '%{http_code}'`) lands on HTTP/2 200, a public unauthenticated
      SharePoint/OneDrive folder listing -- no sign-in wall was hit at any hop, so
      requires_registration is recorded as false. HO-3D v2 link:
      https://1drv.ms/f/c/11742dd40d1cbdc1/ElPb2rhOCeRMg-dFSM3iwO8B5nS1SgnQJs9F6l28G0pKKg?e=TMuxgr .
      Folder-level bulk download needs interactive browsing or a OneDrive-aware client (curl
      cannot enumerate/zip a live folder listing), so this release has no `download_ho3d.py`
      (only the 100DOH and DexYCB downloaders ship). HO-3D v3: 103,462
      annotated images + depth maps (arXiv:2107.00887); no total GB is published by the authors.
      A third-party aggregator (hyper.ai) lists HO-3D v2 at ~34.5 GB but this figure is
      unverified against an authoritative source, hence size_gb is left null here.

  - name: hoi4d
    url: https://hoi4d.github.io/
    requires_registration: true
    size_gb: null
    notes: |
      `curl -sIL https://hoi4d.github.io/ | head -1` -> HTTP/2 200.
      HOI4D is treated as registration-gated: obtain it from the dataset owners through the
      official project page above (https://hoi4d.github.io/), which gives the current access
      route and terms; only that page is recorded here, and no mirror or download link is.
      Licensed CC BY-NC 4.0
      (non-commercial). No total GB is published; paper reports 2.4M RGB-D frames / 4000
      sequences / 800 object instances / 16 categories (arXiv:2203.01577).

  - name: arctic
    url: https://arctic.is.tue.mpg.de/
    requires_registration: true
    size_gb: null
    notes: |
      `curl -sIL https://arctic.is.tue.mpg.de/ | head -1` -> HTTP/1.1 200 OK.
      `curl -sIL https://arctic.is.tue.mpg.de/download.php | head -1` -> HTTP/1.1 302 Found,
      redirecting to a `Sign in` page with `Not Registered? Register` (register.php) -- an
      account + accepted license is required before any file becomes reachable, so
      requires_registration is true and only the registration page is recorded. Code/splits
      scripts (open, no login) at https://github.com/zc-alexfan/arctic. Dataset: 2.1M video
      frames (8 third-person views + 1 egocentric view) with 3D hand + object meshes and contact
      annotations (CVPR 2023, Fan et al.); no total GB is published by the authors.

  - name: oakink2
    url: https://oakink.net/v2
    requires_registration: true
    size_gb: null
    notes: |
      `curl -sIL https://oakink.net/v2 | head -1` -> HTTP/2 301 -> HTTP/2 200 (redirects to
      https://www.oakink.net/v2). The official page states OakInk2 "is currently in preview.
      Annotations are subject to future changes" and does not give a direct bulk-download link
      or registration form on this page, so OakInk2 is
      treated as registration-gated and only this project page is recorded as the primary
      pointer, consistent with OakInk v1's known gate (Google Form
      https://forms.gle/g6QEmmCeZYLGaVe29 before annotation files are released).
      For transparency: a maintainer-hosted mirror exists at
      https://huggingface.co/datasets/kelvin34501/OakInk-v2 (`curl -sIL ... | head -1` ->
      HTTP/2 200; `GET https://huggingface.co/api/datasets/kelvin34501/OakInk-v2` reports
      `"gated": false`, license cc-by-sa-4.0, 1M-10M rows) -- this is publicly downloadable
      without a HF access request, but it is a "preview" mirror maintained by a toolkit author
      rather than the canonical release, so it is noted here rather than substituted as the
      primary url. Paper: arXiv:2403.19417.

  - name: ego4d
    url: https://ego4d.dev/request/ego4d
    requires_registration: true
    size_gb: 30000.0
    notes: |
      `curl -sIL https://ego4d-data.org/ | head -1` -> HTTP/2 200 (public docs/info site).
      `curl -sIL https://ego4d.dev/request/ego4d | head -1` -> HTTP/2 429 on repeated automated
      HEAD requests (Cloudflare-style rate limiting on the licensing app, not a content error);
      per docs.ego-exo4d-data.org and ego4d-data.org/docs/start-here, the license agreement must
      be reviewed and executed at this URL, after which AWS access credentials are emailed
      (~48 h approval turnaround, credentials expire after 14 days). Gated the whole way through
      -- only the registration page is recorded. Full
      primary dataset ~7.1 TB (7100 GB); "entire dataset" including all derived features is
      cited at 30+ TB. size_gb records that coarse upper bound (30000 GB) -- treat it as
      "tens of TB", not a precise figure; most downstream uses only need a benchmark subset,
      not the full corpus.
