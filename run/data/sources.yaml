# Dataset source manifest for HandReel.
#
# Every entry has: name, url, requires_registration (bool), size_gb, notes.
# `notes` records the `curl -sIL <url> | head -1` (or equivalent) HTTP status observed on the
# research date below, plus format/gating details discovered while reading each project page.
# Optional `files:` lists give the individual component URLs consumed by the downloader scripts
# in this directory (download_100doh.py, download_dexycb.py) so no URL is hardcoded in Python.
#
# Research date: 2026-09-12. Re-verify before relying on this for a new download run; academic
# mirrors (Google Drive / OneDrive / Baidu links) rotate periodically.

datasets:
  - name: 100doh
    url: https://fouheylab.eecs.umich.edu/~dandans/projects/100DOH/downloads/file.zip
    requires_registration: false
    size_gb: 0.0246
    notes: |
      `curl -sIL https://fouheylab.eecs.umich.edu/~dandans/projects/100DOH/downloads/file.zip
      | head -1` -> HTTP/1.1 200 OK (Content-Length 26416596 bytes = 0.0246 GB).
      `curl -sIL https://fouheylab.eecs.umich.edu/~dandans/projects/100DOH/download.html | head -1`
      -> HTTP/1.1 200 OK (project download page).
      file.zip (public, no click-through) unpacks to: meta_100DOH_video.txt (27306 rows: video_id,
      genre, duration_s, resolution, frame_rate, frame_number, creation_time, youtube_link) and
      meta_100K_frame.txt (99899 rows: image_name, video_id, frame_index, genre, duration_s,
      resolution, frame_rate, frame_number, creation_time, youtube_link), plus train/val/test/
      trainval .json hand-contact bounding-box annotations. Per README_100K.md, frames were
      extracted with `ffmpeg -i video -vf fps=0.5 ...`, i.e. one frame every 2 s, so 1-based
      frame_index i maps to an approximate source-video timestamp t = (i - 1) * 2.0 s. This is
      the machine-readable video-id/frame list the downloader discovers.
      Pre-extracted frame caches (raw.zip / pascal_voc_format.zip) sit behind a free, no-signup
      click-through agreement at ./agreement.html?raw -- not needed here since 10 s clips are
      re-fetched from YouTube directly via yt-dlp.
      TLS note: `openssl s_client -connect fouheylab.eecs.umich.edu:443` on 2026-09-12 reports
      `Verify return code: 10 (certificate has expired)` -- a server-side issue on the
      University of Michigan's end (cert subject CN=all.eecs.umich.edu), not a client/sandbox
      problem; the earlier `curl -sIL` 200s above were obtained with `-k`/`--insecure`. Plain
      `curl -sIL` (no -k) and Python's verified `urllib.request.urlretrieve` both fail with
      SSL: CERTIFICATE_VERIFY_FAILED. download_100doh.py fails loudly on this by default and
      only retries without verification if the operator passes `--insecure-tls` (never a
      silent bypass) -- see that script's module docstring for the exact, hardcoded host
      allowlist this applies to.
    files:
      - name: annotations
        url: https://fouheylab.eecs.umich.edu/~dandans/projects/100DOH/downloads/file.zip
        size_gb: 0.0246
      - name: readme
        url: https://fouheylab.eecs.umich.edu/~dandans/projects/100DOH/downloads/README_100K.md
        size_gb: 0.000004

  - name: dexycb
    url: https://dex-ycb.github.io/
    requires_registration: false
    size_gb: 122.6
    notes: |
      `curl -sIL https://dex-ycb.github.io/ | head -1` -> HTTP/2 200.
      `curl -sIL https://github.com/NVlabs/dex-ycb-toolkit | head -1` -> HTTP/2 200 (eval/reader
      toolkit; not used by the download, useful reference for src/fastdo/io/datasets/dexycb.py).
      Data is hosted on Google Drive as one CC-BY-NC-4.0 archive per subject (10 subjects, ~12 GB
      each) plus calibration.tar.gz (16 KB), models.tar.gz (1.4 GB, YCB meshes), bop.tar.gz
      (1.2 GB, optional BOP-format annotations) and a single combined dex-ycb-20210415.tar.gz
      (119 GB, redundant with the per-subject files -- skipped by default). No login wall was
      hit fetching any of these (`curl -sIL` on each `drive.google.com/file/d/<id>` -> HTTP/2
      302, 302, 200), so requires_registration is recorded as false. Large-file bytes verified
      with `curl -r 0-2047 https://drive.usercontent.google.com/download?id=<id>&export=download
      &confirm=t` returning valid gzip magic bytes for calibration, models and subject-03 (this
      is the URL pattern download_dexycb.py streams from).
      DexYCB's official toolkit (dex_ycb_toolkit/dex_ycb.py) defines split `s0` (`test`) as
      subject_ind = [2..9] (0-based, i.e. subjects 03-10) x sequence_ind = [i for i in range(100)
      if i % 5 == 4] (20 of 100 sequences per subject) = 8 * 20 = 160 sequences (all 8 camera
      serials are kept for s0 test). The paper has no evaluation on those 160 sequences; its
      held-out DexYCB views are all from subject 08, one of these eight subjects. `--subset eval` downloads calibration.tar.gz + models.tar.gz + the 8
      subject archives for subjects 03-10 (~97.4 GB total, under the 100 GB budget) -- this is
      coarser than the split's 160 sequences (each subject archive holds all 100 of that
      subject's sequences, not just its 20 s0-test sequences) because Google Drive only exposes
      per-subject granularity, not per-sequence; extraneous sequences can be deleted after
      extraction if disk is tight. Subjects 01-02 (not in s0 test) and bop.tar.gz (optional BOP
      annotations, not required by DexYCBReader) are skipped by `--subset eval`; `--subset full`
      adds them but still skips the redundant single-archive alternative.
